name: syncthing
services:
  syncthing:
    image: syncthing/syncthing:1.29.7
    container_name: syncthing
    restart: unless-stopped
    ports:
      - 127.0.0.1:8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    volumes:
      - /DATA/Apps/syncthing:/var/syncthing:rw
      - /DATA/Sync:/Sync:rw
